name: E2E

on:
  pull_request:
  schedule:
    - cron: '0 6 * * *' # nightly

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U collab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @collab/db prisma migrate deploy
        env:
          DATABASE_URL: postgresql://collab:collab@localhost:5432/collab
      - run: pnpm --filter @collab/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://collab:collab@localhost:5432/collab
          REDIS_URL: redis://localhost:6379
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
