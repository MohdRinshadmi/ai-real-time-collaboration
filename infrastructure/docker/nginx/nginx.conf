# NGINX reverse proxy for WebSocket-friendly local deployments.
# Production uses NGINX Ingress in Kubernetes — config is similar.

worker_processes auto;
events { worker_connections 4096; }

http {
  upstream web        { server web:3000; }
  upstream api        { server api:4000; }
  upstream realtime   { server realtime:4001; }
  upstream ai_gateway { server ai-gateway:4002; }

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # WebSocket — sticky session via ip_hash on the upstream (small deploys)
    location /socket.io/ {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }

    location /api/      { proxy_pass http://api/; }
    location /ai/       { proxy_pass http://ai_gateway/; }
    location /          { proxy_pass http://web; }
  }
}
