version: '3.9'

# Local development stack. Boot with `pnpm docker:up`.
# Apps run via `pnpm dev` on the host so we get hot reload + native debugger.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collab']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO stands in for S3 locally
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: collab
      MINIO_ROOT_PASSWORD: collab123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # Local OTel collector → Jaeger UI on :16686
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ['--config=/etc/otel.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel.yaml
    ports:
      - '4318:4318' # OTLP http
      - '4317:4317' # OTLP grpc

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686'
      - '14250:14250'

volumes:
  postgres-data:
  redis-data:
  minio-data:
