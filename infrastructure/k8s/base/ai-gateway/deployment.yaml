apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-gateway, namespace: collab, labels: { app: ai-gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-gateway } }
  template:
    metadata: { labels: { app: ai-gateway } }
    spec:
      containers:
        - name: ai-gateway
          image: ghcr.io/collab/ai-gateway:latest
          ports: [{ name: http, containerPort: 4002 }]
          envFrom:
            - { secretRef: { name: ai-gateway-env } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: '1',  memory: 1Gi }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe:  { httpGet: { path: /healthz, port: http } }
