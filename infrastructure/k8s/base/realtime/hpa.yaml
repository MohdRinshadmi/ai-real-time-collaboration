apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: realtime, namespace: collab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: realtime }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    # Custom metric: connections-per-pod. Scale before any pod hits its
    # connection ceiling (~8K).
    - type: Pods
      pods:
        metric: { name: socket_connections_total }
        target: { type: AverageValue, averageValue: '5000' }
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
