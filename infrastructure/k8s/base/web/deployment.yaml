apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: collab, labels: { app: web } }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532 }
      containers:
        - name: web
          image: ghcr.io/collab/web:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - { secretRef: { name: web-env } }
            - { configMapRef: { name: web-config } }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits:   { cpu: 800m, memory: 768Mi }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          livenessProbe:  { httpGet: { path: /, port: http }, initialDelaySeconds: 20 }
